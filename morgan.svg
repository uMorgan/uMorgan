<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="460" viewBox="0 0 940 460" preserveAspectRatio="xMidYMid meet" font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0E1626"/>
      <stop offset="60%" stop-color="#080D18"/>
      <stop offset="100%" stop-color="#04070D"/>
    </radialGradient>

    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9E2C" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#1C2942" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3FD0C9" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3FD0C9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3FD0C9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3FD0C9" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="terminalClip">
      <rect x="0" y="30" width="370" height="320" rx="0"/>
    </clipPath>
  </defs>

  <style>
    .bg-rect { fill: url(#bg); stroke: url(#borderGrad); stroke-width: 1.5; }
    .txt-primary { fill: #E6ECF7; font-size: 13px; font-weight: 500; }
    .txt-muted { fill: #8393B0; font-size: 12px; }
    .txt-amber { fill: #FF9E2C; font-size: 13px; font-weight: 600; }
    .txt-cyan { fill: #3FD0C9; font-size: 12px; font-weight: 600; }
    .txt-title { fill: #E6ECF7; font-size: 26px; font-weight: 700; letter-spacing: 1px; }
    .txt-sub { fill: #FF9E2C; font-size: 14px; font-weight: 600; letter-spacing: 0.5px; }
    .txt-ascii { fill: #3FD0C9; font-size: 4.8px; line-height: 5.2px; opacity: 0.92; }
    .btn-bg { fill: #0E1626; stroke: #1C2942; stroke-width: 1; }

    @keyframes matrixGlitch1 {
      0%, 100% { fill: #3FD0C9; opacity: 0.95; }
      30% { fill: #FF9E2C; opacity: 1.0; }
      35% { fill: #5EEAD4; opacity: 0.4; }
      40% { fill: #3FD0C9; opacity: 0.95; }
    }
    @keyframes matrixGlitch2 {
      0%, 100% { fill: #3FD0C9; opacity: 0.90; }
      60% { fill: #FF9E2C; opacity: 1.0; }
      65% { fill: #3FD0C9; opacity: 0.5; }
      70% { fill: #3FD0C9; opacity: 0.90; }
    }
    @keyframes matrixGlitch3 {
      0%, 100% { fill: #3FD0C9; opacity: 0.95; }
      80% { fill: #5EEAD4; opacity: 0.3; }
      85% { fill: #FF9E2C; opacity: 1.0; }
      90% { fill: #3FD0C9; opacity: 0.95; }
    }
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes scanBeamAnim {
      0% { transform: translateY(0px); opacity: 0; }
      15% { opacity: 0.7; }
      85% { opacity: 0.7; }
      100% { transform: translateY(310px); opacity: 0; }
    }

    .m-glitch-1 { animation: matrixGlitch1 3.5s infinite ease-in-out; }
    .m-glitch-2 { animation: matrixGlitch2 4.2s infinite ease-in-out 0.8s; }
    .m-glitch-3 { animation: matrixGlitch3 2.8s infinite ease-in-out 1.5s; }
    .cursor-blink { animation: cursorBlink 1s infinite; fill: #FF9E2C; }
    .scan-beam { animation: scanBeamAnim 3.8s infinite linear; }
  </style>

  <!-- Container Box -->
  <rect class="bg-rect" x="10" y="10" width="920" height="440" rx="12"/>

  <!-- Window Header Controls -->
  <circle cx="34" cy="34" r="5" fill="#FF5F56"/>
  <circle cx="50" cy="34" r="5" fill="#FFBD2E"/>
  <circle cx="66" cy="34" r="5" fill="#27C93F"/>
  <text x="90" y="38" class="txt-muted">umorgan@dev-environment:~</text>
  <line x1="10" y1="52" x2="930" y2="52" stroke="#1C2942" stroke-width="1"/>

  <!-- Left Side: Animated ASCII Terminal Frame -->
  <g transform="translate(30, 70)">
    <rect x="0" y="0" width="370" height="350" rx="8" fill="#060A12" stroke="#1C2942" stroke-width="1"/>
    <text x="14" y="22" class="txt-amber" font-size="11">/&gt; MATRIX_PORTRAIT.ASCII <tspan class="cursor-blink">_</tspan></text>
    <line x1="0" y1="30" x2="370" y2="30" stroke="#1C2942" stroke-width="1"/>

    <g clip-path="url(#terminalClip)">
      <text x="12" y="44" class="txt-ascii" xml:space="preserve">
